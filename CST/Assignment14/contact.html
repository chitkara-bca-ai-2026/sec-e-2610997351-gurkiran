<!DOCTYPE html>
<html>
<head>
    <title>Contact Us</title>
</head>

<body>

    <center>
        <h1>Contact Us</h1>
        <hr>
    </center>

    <h2>Get in Touch</h2>

    <p>
        If you have questions about admissions, courses,
        or university activities, please contact the
        university through its official channels.
    </p>

    <h3>University Information</h3>

    <p><b>Name:</b> Chitkara University</p>

    <p><b>Location:</b> Rajpura, Punjab, India</p>

    <h3>Send an Enquiry</h3>

    <form>
        <label for="name">Full Name:</label><br>
        <input type="text" id="name" name="name" required>
        <br><br>

        <label for="email">Email Address:</label><br>
        <input type="email" id="email" name="email" required>
        <br><br>

        <label for="message">Your Message:</label><br>
        <textarea id="message" name="message"
                  rows="5" cols="30" required></textarea>
        <br><br>

        <input type="submit" value="Submit">
        <input type="reset" value="Reset">
    </form>

</body>
</html>
