<!DOCTYPE html>
<html>
<head>
    <title>Interactive World Map</title>
</head>

<body>

    <h1>Interactive World Map</h1>

    <p>Click on a country to explore more.</p>

    <img src="worldmap.jpg"
         width="1127"
         height="757"
         alt="World Map"
         usemap="#worldmap">

    <map name="worldmap">

        
        <area shape="circle"
              coords="763,370,35"
              href="https://www.incredibleindia.gov.in/en"
              alt="India Tourism"
              target="_blank">

        <area shape="circle"
              coords="930,555,65"
              href="https://www.australia.com/"
              alt="Australia Tourism"
              target="_blank">

        
        <area shape="rect"
              coords="135,240,345,350"
              href="https://www.gousa.in/"
              alt="USA Tourism"
              target="_blank">

       
        <area shape="rect"
              coords="790,270,895,350"
              href="https://www.travelchina.org.cn/en"
              alt="China Tourism"
              target="_blank">

        
        <area shape="poly"
              coords="300,405,345,395,385,430,375,485,345,535,310,515,290,465"
              href="https://www.gov.br/turismo/"
              alt="Brazil Tourism"
              target="_blank">

        
        <area shape="poly"
              coords="620,180,700,135,800,145,900,155,985,190,930,250,850,260,780,235,700,245"
              href="https://www.russiatourism.ru/"
              alt="Russia Tourism"
              target="_blank">

        
        <area shape="default"
              href="https://www.google.com/"
              alt="World Map"
              target="_blank">

    </map>

</body>
</html>
