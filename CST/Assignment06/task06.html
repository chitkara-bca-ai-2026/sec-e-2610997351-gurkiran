<!DOCTYPE html>
<html>
<head>
    <title>Food Menu</title>
</head>

<body>

    <h1>Interactive Food Menu</h1>

    <p>Click on the food items to know more about them.</p>

    <img src="food.png" usemap="#foodmap" width="1536" height="1024">

    <map name="foodmap">
        <area shape="circle" coords="610,660,330"
        href="https://www.dominos.co.in/"
        alt="Pizza" target="_blank">
        <area shape="circle" coords="290,330,180"
        href="https://www.burgerking.in/"
        alt="Burger" target="_blank">

    
        <area shape="rect" coords="490,30,820,410"
        href="https://www.mcdonalds.com/"
        alt="French Fries" target="_blank">

    
        <area shape="rect" coords="830,40,1200,480"
        href="https://www.zomato.com/"
        alt="Menu Card" target="_blank">
        <area shape="poly"
        coords="1080,450,1350,270,1490,360,1480,620,1280,620,1080,530"
        href="https://www.subway.com/"
        alt="Sandwich" target="_blank">

    
        <area shape="poly"
        coords="1120,700,1320,620,1460,700,1430,900,1160,900,1120,820"
        href="https://www.bubblecake.com/"
        alt="Cake Slice" target="_blank">

        <area shape="default"
        href="https://www.google.com/"
        alt="More Food">

    </map>

</body>

</html>
